services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ideation
      POSTGRES_PASSWORD: ideation
      POSTGRES_DB: ideation
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ideation -d ideation"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
